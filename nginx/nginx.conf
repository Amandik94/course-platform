upstream django_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 20M;  # для загрузки аватаров/обложек курсов

    # --- Frontend: раздача собранного React ---
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # SPA-роутинг: если файл не найден на диске (например, /courses/5 —
        # это не физический файл, а маршрут React Router), отдаём index.html,
        # и клиентский роутер сам разберётся, что показать
        try_files $uri $uri/ /index.html;
    }

    # --- Backend API ---
    location /api/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Django admin ---
    location /admin/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- drf-spectacular документация ---
    location /api/schema/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
    }

    # --- Статика Django (admin CSS/JS, DRF browsable API) ---
    location ^~ /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- Медиафайлы (аватары, обложки курсов, PDF-сертификаты) ---
    location ^~ /media/ {
        alias /app/media/;
        expires 7d;
    }

    # --- Кэширование статики самого React (JS/CSS с хэшами в имени) ---
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Понятные страницы ошибок (согласно ТЗ п.38, на уровне сервера) ---
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}