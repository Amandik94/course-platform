services:
  postgres:
    image: postgres:16-alpine
    container_name: lms_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lms_backend_prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_DEBUG: "False"
      DB_HOST: postgres
    volumes:
      - media_prod_data:/app/media
      - static_prod_data:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=5)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend-build:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1/
    container_name: lms_frontend_build_prod
    volumes:
      - frontend_prod_dist:/dist_output
    command: sh -c "cp -r /dist/* /dist_output/"

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: lms_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - frontend_prod_dist:/usr/share/nginx/html:ro
      - static_prod_data:/app/staticfiles:ro
      - media_prod_data:/app/media:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend-build:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/api/health/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_prod_data:
  media_prod_data:
  static_prod_data:
  frontend_prod_dist:
